# Agenda lo que Marcus subio a entrada/{marca}/ en R2 y hace commit del calendario.
# Se corre a mano desde GitHub: Actions -> "Subir lote" -> Run workflow.
# (En la Fase 6 tambien se correra automaticamente antes de publicar.)

name: Subir lote

on:
  workflow_dispatch:
    inputs:
      marca:
        description: "Marca a procesar"
        type: choice
        options: [todas, ftnd, tezontle]
        default: todas
      simular:
        description: "Solo mostrar lo que haria (no cambia nada)"
        type: boolean
        default: false

# Mismo grupo que publicar.yml para que nunca escriban el calendario a la vez.
concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  subir-lote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: npm ci

      - name: Agendar desde R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MARCA: ${{ inputs.marca }}
          SIMULAR: ${{ inputs.simular }}
        run: |
          args=()
          if [ "$MARCA" != "todas" ]; then args+=(--marca "$MARCA"); fi
          if [ "$SIMULAR" = "true" ]; then args+=(--simular); fi
          npm run subir-lote -- "${args[@]}"

      # Se ejecuta aunque algun archivo haya fallado, para no perder lo que si se agendo.
      - name: Commit del calendario
        if: always() && inputs.simular == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contenido/
          if git diff --cached --quiet; then
            echo "Sin cambios en el calendario."
          else
            git commit -m "chore: agenda lote desde R2 [skip ci]"
            git push
          fi
