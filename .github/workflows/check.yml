# Valida credenciales de Meta y R2 por marca. Solo lee, no publica nada.
# Se corre a mano desde GitHub: Actions -> "Check" -> Run workflow.

name: Check

on:
  workflow_dispatch:
    inputs:
      marca:
        description: "Marca a revisar"
        type: choice
        options: [todas, ftnd, tezontle]
        default: todas

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check
        env:
          GRAPH_VERSION: v27.0
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          FTND_IG_TOKEN: ${{ secrets.FTND_IG_TOKEN }}
          FTND_IG_USER_ID: ${{ secrets.FTND_IG_USER_ID }}
          TEZONTLE_IG_TOKEN: ${{ secrets.TEZONTLE_IG_TOKEN }}
          TEZONTLE_IG_USER_ID: ${{ secrets.TEZONTLE_IG_USER_ID }}
          TEZONTLE_FB_PAGE_TOKEN: ${{ secrets.TEZONTLE_FB_PAGE_TOKEN }}
          TEZONTLE_FB_PAGE_ID: ${{ secrets.TEZONTLE_FB_PAGE_ID }}
          TEZONTLE_LINKEDIN_TOKEN: ${{ secrets.TEZONTLE_LINKEDIN_TOKEN }}
          TEZONTLE_LINKEDIN_PERSON_URN: ${{ secrets.TEZONTLE_LINKEDIN_PERSON_URN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MARCA: ${{ inputs.marca }}
        run: |
          if [ "$MARCA" = "todas" ]; then npm run check; else npm run check -- --marca "$MARCA"; fi
