# Publica lo que ya toca en el calendario de cada marca y guarda los estados.
# - Automatico: cada 30 minutos (en los minutos :02 y :32), para salir cerca
#   de los horarios :00 y :30. GitHub puede retrasarlo unos minutos.
# - Manual: Actions -> "Publicar" -> Run workflow. Con "id" publica esa
#   entrada del calendario de inmediato (util para probar).

name: Publicar

on:
  schedule:
    - cron: "2,32 * * * *"
  workflow_dispatch:
    inputs:
      id:
        description: "ID de la publicacion a publicar YA (vacio = lo que ya toca)"
        type: string
        required: false
        default: ""
      simular:
        description: "Solo mostrar lo que publicaria (no publica nada)"
        type: boolean
        default: false

# Mismo grupo que subir-lote.yml para que nunca escriban el calendario a la vez.
concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ID: ${{ inputs.id || '' }}
      SIMULAR: ${{ inputs.simular && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Publicar
        env:
          GRAPH_VERSION: v27.0
          FTND_IG_TOKEN: ${{ secrets.FTND_IG_TOKEN }}
          FTND_IG_USER_ID: ${{ secrets.FTND_IG_USER_ID }}
          TEZONTLE_IG_TOKEN: ${{ secrets.TEZONTLE_IG_TOKEN }}
          TEZONTLE_IG_USER_ID: ${{ secrets.TEZONTLE_IG_USER_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          args=()
          if [ -n "$ID" ]; then args+=(--id "$ID"); fi
          if [ "$SIMULAR" = "true" ]; then args+=(--simular); fi
          npm run publicar -- "${args[@]}"

      # Siempre guarda los estados (aunque algo haya fallado), para no publicar dos veces.
      - name: Commit de estados
        if: always() && env.SIMULAR != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contenido/
          if git diff --cached --quiet; then
            echo "Sin cambios en el calendario."
          else
            git commit -m "chore: estados de publicacion [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
